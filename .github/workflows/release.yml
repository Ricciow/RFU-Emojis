name: Release

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag (e.g. v1.0.0). Leave empty for an automatic UTC date tag.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-emojis
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          EXISTING_TAGS="$(git ls-remote --tags --refs origin | awk '{print $2}')"
          tag_exists() {
            printf '%s\n' "$EXISTING_TAGS" | grep -Fxq "refs/tags/$1"
          }

          TAG="${INPUT_TAG:-}"
          TAG="${TAG#"${TAG%%[![:space:]]*}"}"
          TAG="${TAG%"${TAG##*[![:space:]]}"}"

          if [[ -n "$TAG" ]]; then
            if ! git check-ref-format "refs/tags/$TAG"; then
              echo "::error::Invalid git tag name: $TAG"
              exit 1
            fi
            if tag_exists "$TAG"; then
              echo "::error::Tag $TAG already exists."
              exit 1
            fi
          else
            BASE_TAG="v$(date -u +%Y.%m.%d)"
            TAG="$BASE_TAG"
            SUFFIX=2
            while tag_exists "$TAG"; do
              TAG="${BASE_TAG}.${SUFFIX}"
              SUFFIX=$((SUFFIX + 1))
            done
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG (manifest version: $VERSION)"

      - name: Build emoji bundle
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/build-emojis.py --version "$VERSION" --output dist/emojis.zip
          (cd dist && sha256sum emojis.zip > emojis.zip.sha256)

      - name: Verify emoji bundle
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from zipfile import ZipFile

          expected_version = os.environ["EXPECTED_VERSION"]
          with ZipFile("dist/emojis.zip") as archive:
              assert archive.testzip() is None, "Corrupt ZIP archive"
              names = set(archive.namelist())
              for required in ("manifest.json", "LICENSE.md", "NOTICE.md"):
                  assert required in names, f"Missing {required}"
              manifest = json.loads(archive.read("manifest.json").decode("utf-8"))
              assert manifest["schemaVersion"] == 1
              assert manifest["version"] == expected_version, f"Unexpected version {manifest['version']!r}"
              assert manifest["emojis"], "Manifest has no emojis"
              for emoji_id, metadata in manifest["emojis"].items():
                  texture = metadata.get("texture")
                  if texture is not None:
                      assert texture in names, f"Missing texture {texture} for {emoji_id}"
          print(f"Verified dist/emojis.zip for version {expected_version}.")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RFU Emojis ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/emojis.zip
            dist/emojis.zip.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
