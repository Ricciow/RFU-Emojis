name: Build

on:
  push:
    branches:
      - "**"
      - "!main"
    paths-ignore:
      - "README.md"
      - ".gitignore"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    name: Validate and build emoji bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build emoji bundle
        run: |
          VERSION="ci-${GITHUB_SHA::7}"
          python scripts/build-emojis.py --version "$VERSION" --output dist/emojis.zip

      - name: Verify emoji bundle
        run: |
          python - <<'PY'
          import json
          from zipfile import ZipFile

          with ZipFile("dist/emojis.zip") as archive:
              assert archive.testzip() is None, "Corrupt ZIP archive"
              names = set(archive.namelist())
              for required in ("manifest.json", "LICENSE.md", "NOTICE.md"):
                  assert required in names, f"Missing {required}"
              manifest = json.loads(archive.read("manifest.json").decode("utf-8"))
              assert manifest["schemaVersion"] == 1
              assert manifest["emojis"], "Manifest has no emojis"
              for emoji_id, metadata in manifest["emojis"].items():
                  texture = metadata.get("texture")
                  if texture is not None:
                      assert texture in names, f"Missing texture {texture} for {emoji_id}"
          print("Verified dist/emojis.zip successfully.")
          PY

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: rfu-emojis-bundle
          path: dist/emojis.zip
          if-no-files-found: error
